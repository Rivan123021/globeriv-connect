</style></head><body><div id="app" class="app"></div><div id="overlay"></div><div id="toast"></div><script>
'use strict';
// Cloudflare staging only. No Render/local account data is read or overwritten.
const API='https://globeriv-api.rivyblox5.workers.dev';
const TOKEN_KEY='gr_cf_staging_session',KNOWN_KEY='gr_cf_staging_known_accounts';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem(TOKEN_KEY)||'',me=null,people=[],requests=[],groups=[],selection=null,messages=[],refresh=null,pending=false,authMode='login',loading=false,notice='',apiOK=true;
const usernames=()=>{try{return JSON.parse(localStorage.getItem(KNOWN_KEY)||'[]')}catch{return []}};
function known(name){let a=usernames().filter(x=>x!==name);localStorage.setItem(KNOWN_KEY,JSON.stringify([name,...a].slice(0,12)))}
function forget(name){localStorage.setItem(KNOWN_KEY,JSON.stringify(usernames().filter(x=>x!==name)));showChooser()}
function toast(s){const el=$('#toast');el.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>{if(el)el.innerHTML=''},3000)}
async function api(path,{method='GET',data=null,authenticated=true}={}){
 const ctl=new AbortController(),tid=setTimeout(()=>ctl.abort(),12000);
 try{
  const headers={'Accept':'application/json'};
  if(data!==null)headers['Content-Type']='application/json';
  if(authenticated&&token)headers.Authorization='Bearer '+token;
  const r=await fetch(API+path,{method,headers,body:data===null?undefined:JSON.stringify(data),signal:ctl.signal,cache:'no-store'});
  const result=await r.json().catch(()=>({ok:false,error:'Invalid API response'}));
  if(!r.ok||result.ok===false)throw Object.assign(new Error(result.error||'Server error '+r.status),{status:r.status});
  apiOK=true;return result;
 }catch(e){apiOK=false;throw e}finally{clearTimeout(tid)}
}
function box(html){$('#app').innerHTML=html}
function showChooser(){clearInterval(refresh);refresh=null;me=null;token='';sessionStorage.removeItem(TOKEN_KEY);selection=null;const names=usernames();box(`<section class="card accountChooser"><div class="logo">GlobeRiv <i>✦</i> Connect</div><p class="muted">Cloudflare-connected test · Choose an account</p><div class="stageNotice">Accounts are stored in Cloudflare D1. Selecting a remembered username still requires its password.</div><div class="authList">${names.map(n=>`<div class="accountEntry"><button class="accountSelect" data-login-user="${esc(n)}"><span class="avatar">${esc(n[0]?.toUpperCase())}</span><strong class="grow cut">${esc(n)}</strong><span>→</span></button><button class="btn flat accountRemove" data-forget="${esc(n)}">Remove</button></div>`).join('')||'<div class="muted">No accounts remembered in this browser yet.</div>'}</div><button class="btn full" id="newLogin">Sign in to another account</button></section>`);$('#newLogin').onclick=()=>authScreen();}
function authScreen(prefill=''){authMode='login';drawAuth(prefill)}
function drawAuth(prefill='') {box(`<section class="card"><div class="logo">GlobeRiv <i>✦</i> Connect</div><p class="muted">Secure Cloudflare staging page</p><div class="stageNotice">Uses Cloudflare accounts and messages. Does not import or overwrite data from your existing homepage.</div><div class="tabs"><button class="btn ${authMode==='login'?'':'alt'}" id="loginTab">Log in</button><button class="btn ${authMode==='signup'?'':'alt'}" id="signupTab">Sign up</button></div><form id="loginForm"><label>Username</label><input id="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" autocomplete="username" value="${esc(prefill)}"><label>Password</label><input type="password" id="pass" minlength="10" required autocomplete="${authMode==='login'?'current-password':'new-password'}"><button class="btn full fixedbtn" id="authButton">${authMode==='login'?'Log in':'Create account'}</button><p class="noticeError" id="err"></p></form><button class="btn flat full" id="chooser">Remembered accounts</button></section>`);
 $('#loginTab').onclick=()=>{authMode='login';drawAuth($('#username').value)};$('#signupTab').onclick=()=>{authMode='signup';drawAuth($('#username').value)};$('#chooser').onclick=showChooser;
 $('#loginForm').onsubmit=async e=>{e.preventDefault();if(pending)return;pending=true;$('#authButton').disabled=true;$('#err').textContent='Connecting…';try{const username=$('#username').value.trim();const res=await api(authMode==='login'?'/api/login':'/api/signup',{method:'POST',data:{username,password:$('#pass').value},authenticated:false});token=res.token;sessionStorage.setItem(TOKEN_KEY,token);me=res.account;known(me.username);await showLoading()}catch(err){$('#err').textContent=err.message}finally{pending=false;const b=$('#authButton');if(b)b.disabled=false}};
}
async function showLoading(){loading=true;box(`<section class="card" style="text-align:center"><div class="logo">GlobeRiv Connect</div><p class="muted">Loading chats securely</p><div class="bar"><div class="fill" id="loadFill"></div></div><div class="loadingnum" id="loadNum">1%</div></section>`);const started=Date.now();await new Promise(resolve=>{const t=setInterval(()=>{const p=Math.min(100,Math.max(1,Math.round((Date.now()-started)/15000*100)));if($('#loadFill'))$('#loadFill').style.width=p+'%';if($('#loadNum'))$('#loadNum').textContent=p+'%';if(p===100){clearInterval(t);resolve()}},120)});loading=false;await home();}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}showChooser()}
async function hydrate(){const [f,r,g]=await Promise.all([api('/api/friends'),api('/api/requests'),api('/api/groups')]);people=f.friends||[];requests=r.requests||[];groups=g.groups||[]}
async function home(){try{await hydrate();notice='';render();if(!refresh)refresh=setInterval(async()=>{if(!me||document.hidden||loading)return;try{await hydrate();if(selection)await refreshMessages(false);renderSidebar();$('#connection')&&($('#connection').textContent='● Connected')}catch(e){$('#connection')&&($('#connection').textContent='Reconnecting… — no data deleted')}},8000)}catch(e){notice=e.message;render()}}
const contactId=x=>x.user_id;
function sidebarMarkup(){const incoming=requests.filter(r=>r.receiver_id===me.id);return `<div class="section">Incoming requests</div>${incoming.map(r=>`<div class="incoming"><div class="tiny muted">Request: ${esc(r.sender_id.slice(0,12))}…</div><div class="split" style="margin-top:6px"><button class="btn small" data-accept="${esc(r.id)}">Accept</button><button class="btn alt small" data-decline="${esc(r.id)}">Decline</button></div></div>`).join('')||'<div class="muted tiny" style="padding:9px 14px">No pending requests</div>'}<div class="section">Groups</div>${groups.map(g=>`<button class="item ${selection?.type==='group'&&selection.id===g.id?'active':''}" data-group="${esc(g.id)}"><span class="avatar">G</span><span class="grow cut">${esc(g.name)}</span></button>`).join('')||'<div class="muted tiny" style="padding:9px 14px">No groups yet</div>'}<button class="btn alt small" style="margin:8px 14px" data-create-group>Create group</button><div class="section">Connected members</div>${people.map(f=>`<button class="item ${selection?.type==='private'&&selection.id===contactId(f)?'active':''}" data-peer="${esc(contactId(f))}"><span class="avatar">✦</span><span class="grow cut">${esc(contactId(f).slice(0,14))}…</span></button>`).join('')||'<div class="muted tiny" style="padding:9px 14px">No contacts yet</div>'}`}
function renderSidebar(){const side=$('#sideList');if(side)side.innerHTML=sidebarMarkup()}
function render(){if(!me)return showChooser();box(`<div class="shell ${selection?'chatopen':''}" id="shell"><aside><header><div class="logo">GlobeRiv <i>✦</i> Connect</div><div class="row me"><div class="avatar" title="${esc(me.username)}">${esc(me.username[0]?.toUpperCase())}</div><span class="grow muted tiny" id="connection">● Connected</span><button class="btn alt small" data-settings>⚙</button><button class="btn flat small" data-logout>Log out</button></div><div class="stageNotice">Cloudflare staging · Calls and media temporarily disabled</div><form id="searchForm"><label>Search members</label><div class="row"><input id="searchUser" minlength="2" maxlength="24" placeholder="Username" required><button class="btn alt">Search</button></div></form><div id="searchResults"></div><div class="noticeError" id="feedback">${esc(notice)}</div></header><div class="list" id="sideList">${sidebarMarkup()}</div></aside><main class="chat" id="chat"><div class="chathead"><button class="btn flat back" data-back>←</button><span class="avatar">${selection?.type==='group'?'G':'✦'}</span><div class="grow"><strong class="cut" id="chatTitle">${selection?esc(selection.title):'Chats'}</strong><div class="muted tiny">${selection?.type==='group'?'Group conversation':'Cloudflare D1'}</div></div>${selection?.type==='group'?'<button class="btn alt small" data-manage-group>Group settings</button>':selection?'<button class="btn flat small" data-unfriend>⋮</button>':''}</div><div class="messages" id="messages"><div class="empty">${selection?'Loading messages…':'Choose a member or group to chat'}</div></div><form class="composer" id="composer"><input id="messageInput" maxlength="2000" ${selection?'':'disabled'} placeholder="Write a message"><button class="btn" ${selection?'':'disabled'}>Send</button></form></main></div>`);$('#searchForm').onsubmit=searchUser;$('#composer').onsubmit=sendMessage;if(selection)refreshMessages(true).catch(e=>error(e.message));}
function error(msg){const n=$('#feedback');if(n)n.textContent=msg;else toast(msg)}
async function searchUser(e){e.preventDefault();try{const term=$('#searchUser').value.trim(),r=await api('/api/members?q='+encodeURIComponent(term));$('#searchResults').innerHTML=(r.members||[]).map(m=>`<div class="item"><span class="grow cut">${esc(m.username)}</span><button class="btn alt small" data-request="${esc(m.id)}">Add</button></div>`).join('')||'<div class="muted tiny">No members found.</div>';}catch(e){error(e.message)}}
async function sendMessage(e){e.preventDefault();if(!selection||pending)return;const input=$('#messageInput'),content=input.value.trim();if(!content)return;pending=true;try{await api('/api/messages/send',{method:'POST',data:selection.type==='group'?{groupId:selection.id,content}:{userId:selection.id,content}});input.value='';await refreshMessages(true)}catch(e){error(e.message)}finally{pending=false}}
async function refreshMessages(force){if(!selection)return;const selected=selection;const path='/api/messages?'+(selected.type==='group'?'groupId=':'userId=')+encodeURIComponent(selected.id);const r=await api(path);if(selection!==selected)return;messages=r.messages||[];const el=$('#messages');if(!el)return;const markup=messages.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':''}">${selected.type==='group'?`<div class="msgUser">${esc(m.sender_id===me.id?'You':m.sender_id.slice(0,10)+'…')}</div>`:''}<button class="msgbtn" title="Message actions" data-msg="${esc(m.id)}">⋮</button>${m.deleted_for_everyone?'<em>Message deleted</em>':esc(m.content||'')} ${m.starred?'⭐':''}<small>${new Date(m.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">No messages yet</div>';if(force||el.dataset.sig!==markup){const near=el.scrollHeight-el.scrollTop-el.clientHeight<100;el.innerHTML=markup;el.dataset.sig=markup;if(near||force)el.scrollTop=el.scrollHeight}}
function modal(content){$('#overlay').innerHTML=`<div class="overlay"><div class="card modal">${content}<div class="actions"><button class="btn flat" data-close>Close</button></div><div class="noticeError" id="modalError"></div></div></div>`}
function modalError(msg){const n=$('#modalError');if(n)n.textContent=msg;else toast(msg)}
async function groupSettings(){if(selection?.type!=='group')return;const gid=selection.id;try{const r=await api('/api/groups/members?groupId='+encodeURIComponent(gid));const own=groups.find(g=>g.id===gid),isAdmin=['admin','creator'].includes(own?.role);modal(`<h2>${esc(own?.name||'Group')}</h2><div class="stageNotice">Group permissions are enforced by your Cloudflare Worker.</div><div class="membersBox">${(r.members||[]).map(m=>`<div class="memberline"><span class="grow cut">${esc(m.user_id.slice(0,16))}… <span class="muted">${esc(m.role)}</span></span>${isAdmin&&m.user_id!==me.id&&m.role!=='creator'?`<button class="btn alt small" data-group-role="${esc(m.user_id)}" data-current-role="${esc(m.role)}">${m.role==='admin'?'Demote':'Promote'}</button><button class="btn small" data-group-remove="${esc(m.user_id)}">Remove</button>`:''}</div>`).join('')}</div>${isAdmin?`<label>Group name</label><div class="row"><input id="renameVal" value="${esc(own.name)}"><button class="btn alt small" data-rename>Save</button></div><label><input type="checkbox" id="allowAdd" style="width:auto" ${own.allow_member_add?'checked':''}> Allow regular members to add</label><button class="btn alt full" data-save-add>Save permission</button>`:''}<button class="btn alt full" data-open-add>Add connected member</button><button class="btn full" data-leave-group>Leave group</button>`)}catch(e){error(e.message)}}
function groupCreate(){modal(`<h2>Create group</h2><label>Group name</label><input id="newGroupName" maxlength="80"><button class="btn full" data-create-now>Create</button><p class="muted tiny">Add connected members after creating the group using Group settings.</p>`)}
function groupMembersAdd(){modal(`<h2>Add connected member</h2>${people.map(x=>`<div class="memberline"><span class="grow cut">${esc(x.user_id.slice(0,18))}…</span><button class="btn alt small" data-group-add="${esc(x.user_id)}">Add</button></div>`).join('')||'No connected users'}`)}
async function messageMenu(id){const m=messages.find(x=>x.id===id);if(!m)return;modal(`<h2>Message actions</h2><div class="stack"><button class="btn alt" data-action="${m.starred?'unstar':'star'}" data-id="${esc(id)}">${m.starred?'Unstar':'Star'} message</button><button class="btn alt" data-action="hide" data-id="${esc(id)}">Delete for me</button><button class="btn" data-action="deleteEveryone" data-id="${esc(id)}">Delete for everyone</button></div><p class="muted tiny">The server will reject actions you lack permission to perform.</p>`)}
async function action(path,data){return api(path,{method:'POST',data})}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 try{
  if(b.hasAttribute('data-login-user')){authScreen(b.dataset.loginUser);return}
  if(b.hasAttribute('data-forget')){forget(b.dataset.forget);return}
  if(b.hasAttribute('data-logout')){await logout();return}
  if(b.hasAttribute('data-close')){$('#overlay').innerHTML='';return}
  if(b.hasAttribute('data-back')){selection=null;render();return}
  if(b.hasAttribute('data-peer')){selection={type:'private',id:b.dataset.peer,title:'Private chat'};render();return}
  if(b.hasAttribute('data-group')){const g=groups.find(x=>x.id===b.dataset.group);selection={type:'group',id:g.id,title:g.name};render();return}
  if(b.hasAttribute('data-request')){await action('/api/requests/send',{userId:b.dataset.request});toast('Request sent');return}
  if(b.hasAttribute('data-accept')||b.hasAttribute('data-decline')){await action('/api/requests/respond',{requestId:b.dataset.accept||b.dataset.decline,status:b.hasAttribute('data-accept')?'accepted':'declined'});await home();return}
  if(b.hasAttribute('data-create-group')){groupCreate();return}
  if(b.hasAttribute('data-create-now')){const name=$('#newGroupName').value.trim();const r=await action('/api/groups/create',{name});$('#overlay').innerHTML='';selection={type:'group',id:r.group.id,title:name};await home();return}
  if(b.hasAttribute('data-manage-group')){await groupSettings();return}
  if(b.hasAttribute('data-group-role')){await action('/api/groups/manage',{groupId:selection.id,userId:b.dataset.groupRole,action:b.dataset.currentRole==='admin'?'demote':'promote'});await home();await groupSettings();return}
  if(b.hasAttribute('data-group-remove')){if(confirm('Remove this member?')){await action('/api/groups/manage',{groupId:selection.id,userId:b.dataset.groupRemove,action:'remove'});await home();await groupSettings()}return}
  if(b.hasAttribute('data-rename')){await action('/api/groups/manage',{groupId:selection.id,action:'rename',name:$('#renameVal').value.trim()});await home();await groupSettings();return}
  if(b.hasAttribute('data-save-add')){await action('/api/groups/manage',{groupId:selection.id,action:'allowMemberAdd',value:$('#allowAdd').checked});await home();await groupSettings();return}
  if(b.hasAttribute('data-open-add')){groupMembersAdd();return}
  if(b.hasAttribute('data-group-add')){await action('/api/groups/manage',{groupId:selection.id,action:'add',userId:b.dataset.groupAdd});await groupSettings();return}
  if(b.hasAttribute('data-leave-group')){if(confirm('Leave this group?')){await action('/api/groups/manage',{groupId:selection.id,action:'leave'});selection=null;$('#overlay').innerHTML='';await home()}return}
  if(b.hasAttribute('data-msg')){await messageMenu(b.dataset.msg);return}
  if(b.hasAttribute('data-action')){await action('/api/messages/action',{messageId:b.dataset.id,action:b.dataset.action});$('#overlay').innerHTML='';await refreshMessages(true);return}
  if(b.hasAttribute('data-settings')){modal(`<h2>Settings</h2><p>Logged in as <b>${esc(me.username)}</b></p><form id="passwordForm"><label>Current password</label><input id="oldPwd" type="password" required><label>New password (10+ characters)</label><input id="newPwd" type="password" minlength="10" required><button class="btn full">Change password</button></form><p class="muted">Profile picture syncing and account deletion are unavailable in this Worker version. They have not been wired to unsafe local storage.</p>`);$('#passwordForm').onsubmit=async ev=>{ev.preventDefault();try{await action('/api/change-password',{oldPassword:$('#oldPwd').value,newPassword:$('#newPwd').value});toast('Password changed. Please log in again.');$('#overlay').innerHTML='';showChooser()}catch(err){modalError(err.message)}};return}
  if(b.hasAttribute('data-unfriend')){modal(`<h2>Contact settings</h2><p class="muted">Unfriending removes your shared private message history as defined by the current Worker.</p><button class="btn full" id="removeFriend">Unfriend</button>`);$('#removeFriend').onclick=async()=>{if(confirm('Unfriend and delete shared chat history?')){try{await action('/api/friends/remove',{userId:selection.id});selection=null;$('#overlay').innerHTML='';await home()}catch(err){modalError(err.message)}}};return}
 }catch(err){modalError(err.message);error(err.message)}
});
(async()=>{if(token){try{const r=await api('/api/me');me=r.account;known(me.username);await home();return}catch{sessionStorage.removeItem(TOKEN_KEY);token=''}}showChooser()})();

</script></body></html>
