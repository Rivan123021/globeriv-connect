<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobeRiv Connect — Cloudflare Test</title><style>
:root{color-scheme:dark;--bg:#070a10;--panel:#101923;--aqua:#7fffe3;--red:#ff405f;--dim:#93a8b0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0 0,#391321,transparent 35%),radial-gradient(ellipse at 100% 100%,#0a3430,transparent 40%),var(--bg);color:#e8fbf7;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;min-height:42px}.hidden{display:none!important}#app{min-height:100dvh;display:grid;place-items:center;padding:12px}.card,.shell{border:1px solid #f0446177;background:linear-gradient(140deg,#15202a,#090e15);border-radius:22px;box-shadow:0 0 24px #ff405f25;overflow:hidden}.card{width:min(460px,100%);padding:26px}.logo{color:var(--aqua);font-size:26px;font-weight:900;text-shadow:0 0 22px #7fffe375}.logo i{font-style:normal;color:var(--red)}.muted{color:var(--dim);font-size:13px}.btn{border:1px solid #ff405f88;color:white;background:linear-gradient(125deg,#d93655,#8f1933);border-radius:11px;padding:10px 14px;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 17px #ff405f77}.btn.alt{background:#18262e;border-color:#478d86;color:var(--aqua)}.btn.flat{background:none;border-color:#3f5159;color:var(--dim)}button:disabled{opacity:.55}input{background:#080f16;border:1px solid #375058;color:white;width:100%;border-radius:11px;padding:12px;outline:0;min-width:0}input:focus{border-color:var(--aqua)}label{display:block;font-size:13px;color:var(--dim);margin:15px 0 8px}.row{display:flex;align-items:center;gap:9px}.grow{flex:1;min-width:0}.full{width:100%;margin-top:15px}.notice{padding:12px;background:#381522;border:1px solid #ff405f55;border-radius:12px;margin:15px 0;font-size:13px}.shell{width:min(1150px,100%);height:min(790px,calc(100dvh - 24px));display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr)}aside{border-right:1px solid #34444c;display:flex;flex-direction:column;min-height:0}header{padding:14px;border-bottom:1px solid #34444c}.section{padding:12px 14px 5px;font-size:12px;color:var(--aqua);letter-spacing:1px}.list{overflow:auto;flex:1}.item{width:100%;padding:12px 14px;text-align:left;color:inherit;background:transparent;border:0;border-bottom:1px solid #2c3841}.item:hover,.item.active{background:#1c3037}.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--aqua);display:grid;place-items:center;background:#173637;color:var(--aqua);flex-shrink:0}.chat{min-width:0;min-height:0;display:flex;flex-direction:column}.chathead{padding:14px;border-bottom:1px solid #34444c}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at center,#122025,#090e14)}.bubble{max-width:80%;align-self:flex-start;border-radius:15px 15px 15px 3px;padding:11px 15px;background:#22343e;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#184941;border-radius:15px 15px 3px 15px}.bubble small{color:#b5c5c6;display:block;font-size:10px;margin-top:4px;text-align:right}.composer{display:flex;gap:9px;padding:12px;border-top:1px solid #34444c}.empty{margin:auto;color:var(--dim);padding:20px;text-align:center}.status{min-height:18px;color:var(--aqua);font-size:12px;margin-top:10px}.back{display:none}.pill{display:inline-block;border-radius:20px;border:1px solid #ff405f66;padding:4px 9px;color:#ffa5b4;font-size:11px;margin-top:12px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.small{font-size:12px}.spinner{animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.4}}@media(max-width:700px){.shell{grid-template-columns:1fr;height:calc(100dvh - 24px)}.shell.chatopen aside{display:none}.shell:not(.chatopen) .chat{display:none}.back{display:inline-flex}.card{padding:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
'use strict';
// ISOLATED STAGING APP. Never imports old localStorage accounts, passwords or databases.
const API='https://globeriv-api.rivyblox5.workers.dev';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('gr_cf_test_token')||'',account=null,friendIds=[],incoming=[],outgoing=[],results=[],opened=null,view='login',busy=false,lastError='',refreshId=null;
function message(text){const n=$('#feedback');if(n)n.textContent=text;else lastError=text}
async function request(path,{method='GET',data=null,auth=true}={}){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const headers={'Accept':'application/json'};
  if(data!==null)headers['Content-Type']='application/json';
  if(auth&&token)headers.Authorization='Bearer '+token;
  const r=await fetch(API+path,{method,headers,body:data===null?undefined:JSON.stringify(data),signal:controller.signal,cache:'no-store'});
  const j=await r.json().catch(()=>({ok:false,error:'Invalid server response'}));
  if(!r.ok||j.ok===false)throw new Error(j.error||`Server error (${r.status})`);
  return j;
 }finally{clearTimeout(timeout)}
}
function rememberLogin(data){token=data.token;account=data.account;sessionStorage.setItem('gr_cf_test_token',token)}
function clearLogin(){sessionStorage.removeItem('gr_cf_test_token');token='';account=null;friendIds=[];incoming=[];outgoing=[];opened=null;clearInterval(refreshId);refreshId=null;}
function authScreen(){view='login';$('#app').innerHTML=`<div class="card"><div class="logo">GlobeRiv <i>✦</i> Connect</div><p class="muted">Cloudflare secure-account integration test</p><span class="pill">STAGING PAGE · NOT THE LIVE APP</span><div class="notice">This page uses your Cloudflare D1 accounts and messages. It does not import, alter or erase browser-local accounts from your existing website. Use disposable accounts only.</div><div class="tabs"><button class="btn ${viewMode==='login'?'':'alt'}" id="loginTab">Log in</button><button class="btn ${viewMode==='signup'?'':'alt'}" id="signupTab">Sign up</button></div><form id="auth"><label>Username</label><input id="name" placeholder="Username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}"><label>Password (10+ characters)</label><input id="password" type="password" minlength="10" autocomplete="${viewMode==='login'?'current-password':'new-password'}" required><button class="btn full" type="submit">${viewMode==='login'?'Log in':'Create account'}</button></form><div class="status" id="feedback" role="status">${esc(lastError)}</div></div>`;
 $('#loginTab').onclick=()=>{viewMode='login';lastError='';authScreen()};$('#signupTab').onclick=()=>{viewMode='signup';lastError='';authScreen()};
 $('#auth').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const btn=$('#auth button');btn.disabled=true;message('Connecting to Cloudflare…');try{const data=await request(viewMode==='login'?'/api/login':'/api/signup',{method:'POST',data:{username:$('#name').value.trim(),password:$('#password').value},auth:false});rememberLogin(data);lastError='';await home();}catch(err){message(err.message)}finally{busy=false;if(btn.isConnected)btn.disabled=false}};
}
let viewMode='login';
async function hydrate(){const [friends,reqs]=await Promise.all([request('/api/friends'),request('/api/requests')]);friendIds=friends.friends||[];const all=reqs.requests||[];incoming=all.filter(x=>x.receiver_id===account.id);outgoing=all.filter(x=>x.sender_id===account.id)}
async function home(){try{await hydrate();render();if(!refreshId)refreshId=setInterval(async()=>{if(!account||document.hidden)return;try{await hydrate();if(opened)await getMessages(false);renderListOnly()}catch{}},10000)}catch(e){lastError=e.message;render()}}
function renderListOnly(){const box=$('#people');if(box)box.innerHTML=listMarkup();const ir=$('#incoming');if(ir)ir.innerHTML=requestMarkup();}
function listMarkup(){return friendIds.map(x=>`<button class="item ${opened===x.user_id?'active':''}" data-open="${esc(x.user_id)}"><div class="row"><span class="avatar">✦</span><span class="grow">Connected member<br><span class="muted small">${esc(x.user_id.slice(0,12))}…</span></span></div></button>`).join('')||'<div class="muted" style="padding:14px">No friends connected yet</div>'}
function requestMarkup(){return incoming.map(x=>`<div class="item"><span class="muted small">Request from ${esc(x.sender_id.slice(0,12))}…</span><div class="row" style="margin-top:7px"><button class="btn small" data-accept="${esc(x.id)}">Accept</button><button class="btn alt small" data-decline="${esc(x.id)}">Decline</button></div></div>`).join('')||'<div class="muted" style="padding:10px">No pending incoming requests</div>'}
function render(){if(!account)return authScreen();$('#app').innerHTML=`<div class="shell ${opened?'chatopen':''}" id="shell"><aside><header><div class="logo">GlobeRiv <i>✦</i> Connect</div><div class="row" style="margin-top:12px"><span class="avatar">${esc(account.username[0]?.toUpperCase())}</span><strong class="grow">${esc(account.username)}</strong><button class="btn flat" id="logout">Log out</button></div><label>Search members</label><form class="row" id="searchForm"><input id="search" placeholder="Username (2+ characters)" minlength="2" maxlength="24" required><button class="btn alt">Go</button></form><div id="feedback" class="status" role="status">${esc(lastError)}</div><div id="searchResults"></div></header><div class="section">INCOMING MEMBER REQUESTS</div><div id="incoming">${requestMarkup()}</div><div class="section">CONNECTED MEMBERS</div><div class="list" id="people">${listMarkup()}</div></aside><main class="chat"><div class="chathead row"><button class="btn flat back" id="back">←</button><strong class="grow">${opened?'Private chat':'Messages'}</strong><span class="muted small">Cloudflare D1</span></div><div class="messages" id="messages"><div class="empty">${opened?'Loading conversation…':'Select a connected member'}</div></div><form id="composer" class="composer"><input id="text" maxlength="2000" placeholder="Write a message" ${opened?'':'disabled'}><button class="btn" ${opened?'':'disabled'}>Send</button></form></main></div>`;
 $('#logout').onclick=async()=>{try{await request('/api/logout',{method:'POST'})}catch{}clearLogin();authScreen()};$('#back').onclick=()=>{opened=null;render()};
 $('#searchForm').onsubmit=async e=>{e.preventDefault();try{const q=$('#search').value.trim();const r=await request('/api/members?q='+encodeURIComponent(q));results=r.members||[];$('#searchResults').innerHTML=results.map(m=>`<div class="item row"><span class="grow">${esc(m.username)}</span><button class="btn alt small" data-add="${esc(m.id)}">Add</button></div>`).join('')||'<p class="muted">No matching members.</p>';}catch(err){message(err.message)}};
 $('#composer').onsubmit=async e=>{e.preventDefault();const t=$('#text').value.trim();if(!opened||!t)return;$('#text').disabled=true;try{await request('/api/messages/send',{method:'POST',data:{userId:opened,content:t}});$('#text').value='';await getMessages(true)}catch(err){message(err.message)}finally{if($('#text'))$('#text').disabled=false}};
 if(opened)getMessages(true).catch(e=>message(e.message));
}
async function getMessages(force){if(!opened)return;const target=opened;const r=await request('/api/messages?userId='+encodeURIComponent(target));if(opened!==target)return;const el=$('#messages');if(!el)return;const markup=(r.messages||[]).map(m=>`<div class="bubble ${m.sender_id===account.id?'mine':''}">${m.deleted_for_everyone?'<em>Deleted message</em>':esc(m.content||'')}<small>${new Date(m.created_at).toLocaleString()}</small></div>`).join('');if(el.dataset.signature!==markup||force){el.innerHTML=markup||'<div class="empty">Start the conversation!</div>';el.dataset.signature=markup;el.scrollTop=el.scrollHeight}}
document.addEventListener('click',async e=>{const add=e.target.closest('[data-add]'),accept=e.target.closest('[data-accept]'),decline=e.target.closest('[data-decline]'),open=e.target.closest('[data-open]');try{if(add){await request('/api/requests/send',{method:'POST',data:{userId:add.dataset.add}});message('Member request sent')}else if(accept||decline){await request('/api/requests/respond',{method:'POST',data:{requestId:(accept||decline).dataset.accept||(accept||decline).dataset.decline,status:accept?'accepted':'declined'}});await home()}else if(open){opened=open.dataset.open;render()}}catch(err){message(err.message)}});
(async()=>{if(token){try{const r=await request('/api/me');account=r.account;await home();return}catch{clearLogin()}}authScreen()})();
</script></body></html>
