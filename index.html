// Reuse the audio element after a normal user gesture; mobile browsers still control autoplay.
const preparedRingtone=new Audio(RINGTONE_DATA);preparedRingtone.loop=true;preparedRingtone.volume=.85;
let ringtoneUnlocked=false;
function unlockRingtone(){if(ringtoneUnlocked)return;preparedRingtone.muted=true;const play=preparedRingtone.play();if(play&&typeof play.then==='function')play.then(()=>{preparedRingtone.pause();preparedRingtone.currentTime=0;preparedRingtone.muted=false;ringtoneUnlocked=true}).catch(()=>{preparedRingtone.muted=false})}
document.addEventListener('pointerdown',unlockRingtone,{passive:true});
document.addEventListener('keydown',unlockRingtone);

function stopRingtone(){if(ringtoneAudio){ringtoneAudio.pause();ringtoneAudio.currentTime=0;ringtoneAudio=null}if(ringVibration){clearInterval(ringVibration);ringVibration=null}if(navigator.vibrate)navigator.vibrate(0)}
function startRingtone(){stopRingtone();ringtoneAudio=preparedRingtone||new Audio(RINGTONE_DATA);ringtoneAudio.loop=true;ringtoneAudio.volume=.85;ringtoneAudio.currentTime=0;ringtoneAudio.play().catch(()=>{toast('Incoming call — sound blocked by browser');});if(navigator.vibrate){const pattern=[350,180,350,1250];navigator.vibrate(pattern);ringVibration=setInterval(()=>navigator.vibrate(pattern),2130)}}
function ensureOwnerAdmin(g){if(!g)return;g.admins=Array.from(new Set([g.owner,...(g.admins||[]).filter(n=>g.members.includes(n))]))}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getDb(){let d;try{d=JSON.parse(localStorage.getItem(KEY))}catch{};d=d||{users:{},requests:[],friends:[],messages:[]};d.groups??={};d.calls??=[];d.deletedUsers??={};return d}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(msg){$('#toast').innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(timer);timer=setTimeout(()=>$('#toast').innerHTML='',3500)}
function current(){db=getDb();return db}function friends(a,b){return db.friends.some(x=>x.includes(a)&&x.includes(b))}function pair(a,b){return [a,b].sort().join('::')}function avatar(name,big=''){const u=String(name).startsWith('g:')?(db.groups?.[String(name).slice(2)]||{}):(db.users[name]||{});return u.avatar?`<img class="avatar ${big}" src="${u.avatar}" alt="">`:`<span class="avatar ${big}">${esc(name?.[0]?.toUpperCase()||'?')}</span>`}
function contactName(n){return db.deletedUsers?.[n]?"Deleted Contact":n}
// Account chooser stores a list of accounts explicitly used in THIS browser, not an IP address.
// A public release needs server-managed sessions; this local demo is not secure authentication.
function rememberedAccounts(){let names=[];try{names=JSON.parse(localStorage.getItem(REMEMBERED)||'[]')}catch{};return Array.isArray(names)?[...new Set(names.filter(n=>typeof n==='string'))].filter(n=>!!getDb().users[n]):[]}

// The following fetch-based client expects a separately deployed HTTPS signaling server.
// POST /signal {to,from,type,payload,id}; GET /signal?user=...&after=...
// Responses: {events:[{id,from,to,type,payload}]}. Server must authenticate, authorize
// connected users, validate messages, and serve globally consistent user records.
function serverUrl(){const u='https://globeriv-connect.onrender.com';return u.includes('REPLACE-WITH-YOUR-SERVER')?'':u} // Replace with your deployed HTTPS server URL
async function signalSend(to,type,payload={}){
 const event={id:(globalThis.crypto?.randomUUID?.())||String(Date.now())+Math.random(),from:me,to,type,payload};
 if(serverUrl()){
  const res=await fetch(serverUrl()+'/signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)});
  if(!res.ok)throw new Error('HTTPS signaling server responded '+res.status);
 }else{
  // Local-only demo signaling for different tabs/windows ON THE SAME ORIGIN.
  const queue=JSON.parse(localStorage.getItem(SIGNAL_KEY)||'[]').filter(x=>Date.now()-x.at<120000);
  queue.push({...event,at:Date.now()});localStorage.setItem(SIGNAL_KEY,JSON.stringify(queue.slice(-120)));
 }
}
async function signalReceive(){
 if(!me||!db.users[me]||callBusy)return;
 callBusy=true;
 try{
  let events=[];
  if(serverUrl()){
   const res=await fetch(serverUrl()+'/signal?user='+encodeURIComponent(me)+'&after='+encodeURIComponent(lastSeenCall),{cache:'no-store'});
   if(!res.ok)return;const data=await res.json();events=data.events||[];
  }else events=JSON.parse(localStorage.getItem(SIGNAL_KEY)||'[]').filter(x=>x.to===me && Date.now()-x.at<120000);
  for(const ev of events){
   if(ev.from===me||ev.to!==me||seenSignals.has(ev.id))continue;
   seenSignals.add(ev.id);
   if(seenSignals.size>350)seenSignals=new Set([...seenSignals].slice(-175));
   if(serverUrl())lastSeenCall=ev.id;
   try{await handleSignal(ev)}catch(err){console.warn('Call event failed',err);callStatus('Call error: '+err.message)}
  }
 }catch(e){console.warn('Signaling unavailable:',e.message)}finally{callBusy=false}
}

 if(canAdd)$('#addToGroup').onclick=()=>{db=getDb();let x=db.groups[id];if(!x?.members.includes(me)||!(x.admins.includes(me)||x.allowMembersAdd))return toast('Not permitted');const names=[...document.querySelectorAll('.addMember:checked')].map(e=>e.value).filter(n=>n!==me&&friends(me,n)&&!x.members.includes(n));if(!names.length)return toast('Select an eligible connection');x.members.push(...names);save();groupSettings(id);render();toast('Members added')};$('#leaveGroup').onclick=()=>{db=getDb();const x=db.groups[id];if(!x?.members.includes(me))return toast('Not in this group');if(!confirm(x.owner===me?'Leave your group? Another admin, or the next member, will become creator. If you are the last member, the group will be deleted.':'Leave this group?'))return;const wasOwner=x.owner===me;x.members=x.members.filter(n=>n!==me);x.admins=x.admins.filter(n=>n!==me);if(!x.members.length){delete db.groups[id]}else if(wasOwner){x.owner=x.admins.find(n=>x.members.includes(n))||x.members[0];x.admins=[...new Set([...x.admins,x.owner])];ensureOwnerAdmin(x)}save();selected='';closeModal();render();toast('You left the group')}}

// Browser-local voice messages. Data URLs are capped because localStorage is not a media database.
function messageContent(m){if(m.deletedEveryone)return `<i class="muted">This message was deleted</i>`;
 if(m.kind==='voice' && typeof m.audio==='string' && /^data:audio\/(webm|ogg|mp4|mpeg|wav)(;codecs=[a-z0-9,.-]+)?;base64,[a-z0-9+/=]+$/i.test(m.audio))
  return `<div class="voiceCaption">🎤 Voice message</div><audio controls preload="none" src="${m.audio}"></audio>`;
 return esc(m.text||'');
}
function setupVoiceButton(){const button=$('#voiceButton');if(!button)return;button.onclick=async()=>{
 if(voiceRecorder?.state==='recording'){voiceRecorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Voice recording needs a supported browser and HTTPS or localhost');
 const destination=selected,sender=me;if(!destination)return;
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('Microphone permission denied or unavailable')}
 if(!window.MediaRecorder.isTypeSupported)return stream.getTracks().forEach(x=>x.stop()),toast('Audio recording unsupported');
 const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t));
 try{voiceRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){stream.getTracks().forEach(x=>x.stop());return toast('Cannot start recorder')}
 voiceStream=stream;const chunks=[];const recorder=voiceRecorder;let length=0;
 recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);length+=e.data.size}};
 recorder.onerror=()=>toast('Audio recording failed');
 recorder.onstop=async()=>{clearTimeout(voiceTimer);stream.getTracks().forEach(t=>t.stop());voiceRecorder=null;voiceStream=null;const b=$('#voiceButton');if(b){b.textContent='🎙';b.title='Record voice message'};
 if(!length)return toast('Recording was empty');if(length>350000)return toast('Voice note too large for this local demo. Record a shorter clip.');
 const blob=new Blob(chunks,{type:recorder.mimeType||mime||'audio/webm'}),audio=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>resolve(null);reader.readAsDataURL(blob)});if(!audio)return toast('Could not encode voice message');
 const currentDb=getDb();db=currentDb;const note={from:sender,kind:'voice',audio,at:Date.now()};
 if(destination.startsWith('g:')){const group=db.groups[destination.slice(2)];if(!group?.members.includes(sender))return toast('You no longer belong to this group');group.messages.push({...note,readBy:[sender]})}
 else{if(!friends(sender,destination))return toast('Connection no longer exists');db.messages.push({...note,to:destination,read:false})}
 try{save();if(selected===destination)render();else members();toast('Voice message sent')}catch(e){toast('Browser storage is full — voice note not saved')}
 };
 recorder.start(250);button.textContent='■ Stop';button.title='Tap to send recording';voiceTimer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},18000);
 toast('Recording voice note. Tap Stop to send (18 seconds max).');
 }}
// Multi-party mesh call demo. One peer connection per other group participant.
function groupCallPanel(g,type,incoming){
 modal(`<h2>${incoming?'Incoming ':''}Group ${type==='video'?'video':'audio'} call</h2><div class="row">${avatar('g:'+g.id,'big')}<div><b>${esc(g.name)}</b><p class="muted" id="callstatus">${incoming?'Group call invitation':'Starting group call…'}</p></div></div><div class="groupCallTiles" id="groupCallTiles"></div><div class="actions" id="groupCallActions">${incoming?'<button class="btn" id="groupAccept">Accept</button><button class="btn alt" id="groupReject">Decline</button>':'<button class="btn" id="groupHangup">End call</button>'}</div>`);
 if(!incoming){renderGroupCallTiles();renderGroupCallControls()}
}
function groupTile(name){const call=groupCall;if(!call)return;const root=$('#groupCallTiles');if(!root||root.querySelector(`[data-tile="${CSS.escape(name)}"]`))return;
 const d=document.createElement('div');d.className='groupCallTile';d.dataset.tile=name;
 d.innerHTML=`<video playsinline autoplay ${name===me?'muted':''} hidden></video><div class="groupCallFace">${avatar(name,'big')}<span class="callCamLabel">${call.type==='video'?'Camera off':'Audio call'}</span></div><b>${esc(name)}</b>`;root.appendChild(d)
}
function updateGroupTile(name,stream,enabled){groupTile(name);const el=[...document.querySelectorAll('.groupCallTile')].find(x=>x.dataset.tile===name);if(!el)return;
 const video=el.querySelector('video'),cover=el.querySelector('.groupCallFace');if(stream&&video.srcObject!==stream)video.srcObject=stream;
 const visible=groupCall?.type==='video'&&enabled!==false&&!!stream?.getVideoTracks().length;
 video.hidden=!visible;cover.hidden=visible;cover.querySelector('.callCamLabel').textContent=groupCall?.type==='video'?'Camera off':'Audio call';if(visible)video.play().catch(()=>{});
}
function renderGroupCallTiles(){if(!groupCall)return;groupTile(me);updateGroupTile(me,groupCall.stream,groupCall.type==='video')}
function renderGroupCallControls(){const bar=$('#groupCallActions');if(!bar||!groupCall)return;bar.innerHTML=`<button class="btn alt" id="groupMute">${groupCall.muted?'🎙 Unmute':'🎙 Mute'}</button>${groupCall.type==='video'?`<button class="btn alt" id="groupCam">${groupCall.cameraOff?'📷 Camera on':'📷 Camera off'}</button>`:''}<button class="btn" id="groupHangup">End call</button>`;
 $('#groupHangup').onclick=()=>endGroupCall(true);$('#groupMute').onclick=()=>{groupCall.muted=!groupCall.muted;groupCall.stream?.getAudioTracks().forEach(t=>t.enabled=!groupCall.muted);renderGroupCallControls()};
 if($('#groupCam'))$('#groupCam').onclick=()=>{groupCall.cameraOff=!groupCall.cameraOff;groupCall.stream?.getVideoTracks().forEach(t=>t.enabled=!groupCall.cameraOff);updateGroupTile(me,groupCall.stream,!groupCall.cameraOff);for(const n of groupCall.peers.keys())signalSend(n,'group-camera',{gid:groupCall.gid,cid:groupCall.cid,enabled:!groupCall.cameraOff}).catch(console.warn);renderGroupCallControls()};
}
async function groupPeer(name){const gc=groupCall;if(!gc)return;let pc=gc.peers.get(name);if(pc)return pc;
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});gc.peers.set(name,pc);
 gc.stream.getTracks().forEach(t=>pc.addTrack(t,gc.stream));pc.onicecandidate=e=>{if(e.candidate)signalSend(name,'group-ice',{gid:gc.gid,cid:gc.cid,ice:e.candidate.toJSON()}).catch(console.warn)};
 pc.ontrack=e=>{if(groupCall!==gc)return;const stream=e.streams[0]||new MediaStream([e.track]);gc.remoteStreams.set(name,stream);updateGroupTile(name,stream,gc.remoteCameras.get(name)!==false)};
 pc.onconnectionstatechange=()=>{if(groupCall!==gc)return;callStatus(name+': '+pc.connectionState);if(pc.connectionState==='failed')callStatus(name+' could not connect. A TURN server may be required.')};return pc;
}
async function startGroupCall(id,type){db=getDb();const g=db.groups[id];if(!g?.members.includes(me))return toast('Not in group');if(groupCall||activeCall)return toast('Already in a call');if(g.members.length<2)return toast('Add another member first');
 if(!navigator.mediaDevices?.getUserMedia)return toast('Calls need HTTPS and a supported browser');let stream;try{stream=await mediaFor(type)}catch(e){return toast(e.message)}
 const cid=crypto?.randomUUID?.()||String(Date.now());groupCall={gid:id,cid,type,startedAt:Date.now(),stream,peers:new Map(),pendingIce:new Map(),remoteStreams:new Map(),remoteCameras:new Map(),acceptedMembers:new Set([me]),muted:false,cameraOff:false};groupCallPanel(g,type,false);renderGroupCallTiles();
 for(const n of g.members.filter(n=>n!==me)){try{const pc=await groupPeer(n),offer=await pc.createOffer();await pc.setLocalDescription(offer);await signalSend(n,'group-offer',{gid:id,cid,type,sdp:pc.localDescription})}catch(e){console.warn('Group call invite failed',n,e)}}
 callStatus('Calling group members…');
}
async function handleGroupSignal(ev){const {from,type,payload:p={}}=ev;db=getDb();const g=db.groups[p.gid];if(!g?.members.includes(me)||!g.members.includes(from))return;const c=groupCall;
 if(type==='group-offer'){
  if(isChatLoading){logCall({remote:'g:'+p.gid,type:p.type||'audio',incoming:true},'missed');await signalSend(from,'group-busy',{gid:p.gid,cid:p.cid});return}
  if(activeCall||groupCall){await signalSend(from,'group-busy',{gid:p.gid,cid:p.cid});return}
  groupCall={gid:p.gid,cid:p.cid,type:p.type||'audio',startedAt:Date.now(),stream:null,peers:new Map(),pendingIce:new Map(),remoteStreams:new Map(),remoteCameras:new Map(),acceptedMembers:new Set(),muted:false,cameraOff:false,pendingOffer:p.sdp,inviter:from};groupCallPanel(g,groupCall.type,true);startRingtone();groupCall.timeout=setTimeout(()=>{if(groupCall?.cid===p.cid&&!groupCall.accepted){endGroupCall(true);toast('Group call: no answer')}},45000);
  $('#groupReject').onclick=()=>endGroupCall(true);$('#groupAccept').onclick=async()=>{const gc=groupCall;if(!gc)return;try{gc.stream=await mediaFor(gc.type);stopRingtone();renderGroupCallTiles();renderGroupCallControls();const pc=await groupPeer(from);await pc.setRemoteDescription(gc.pendingOffer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await signalSend(from,'group-answer',{gid:gc.gid,cid:gc.cid,sdp:pc.localDescription});for(const ice of gc.pendingIce.get(from)||[])await pc.addIceCandidate(ice).catch(console.warn);gc.pendingIce.delete(from);gc.accepted=true;gc.acceptedMembers.add(me);clearTimeout(gc.timeout);callStatus('Connected / connecting…')}catch(e){toast('Group call failed: '+e.message);endGroupCall(true)}};
 }else if(!c||c.gid!==p.gid||c.cid!==p.cid)return;
 else if(type==='group-answer'){const pc=c.peers.get(from);if(pc&&pc.signalingState==='have-local-offer'){
  await pc.setRemoteDescription(p.sdp);for(const ice of c.pendingIce.get(from)||[])await pc.addIceCandidate(ice).catch(console.warn);c.pendingIce.delete(from);
  // The original caller is the coordinator. Each new accepted member is linked to all previously accepted members.
  if(!c.inviter){const existing=[...c.acceptedMembers].filter(n=>n!==me&&n!==from);c.acceptedMembers.add(from);for(const n of existing){await signalSend(n,'group-join',{gid:c.gid,cid:c.cid,newMember:from});}}
 }}
 else if(type==='group-join'){if(c.stream&&p.newMember!==me&&!c.peers.has(p.newMember)){const pc=await groupPeer(p.newMember);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await signalSend(p.newMember,'group-peer-offer',{gid:c.gid,cid:c.cid,type:c.type,sdp:pc.localDescription})}}
 else if(type==='group-peer-offer'){if(c.stream&&!c.peers.has(from)){const pc=await groupPeer(from);await pc.setRemoteDescription(p.sdp);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await signalSend(from,'group-answer',{gid:c.gid,cid:c.cid,sdp:pc.localDescription});for(const ice of c.pendingIce.get(from)||[])await pc.addIceCandidate(ice).catch(console.warn);c.pendingIce.delete(from)}}
 else if(type==='group-ice'){const pc=c.peers.get(from);if(pc?.remoteDescription)await pc.addIceCandidate(p.ice).catch(console.warn);else c.pendingIce.set(from,[...(c.pendingIce.get(from)||[]),p.ice])}
 else if(type==='group-camera'){c.remoteCameras.set(from,p.enabled!==false);updateGroupTile(from,c.remoteStreams.get(from),p.enabled!==false)}
 else if(type==='group-hangup'||type==='group-busy'){c.peers.get(from)?.close();c.peers.delete(from);c.remoteStreams.delete(from);const tile=[...document.querySelectorAll('.groupCallTile')].find(x=>x.dataset.tile===from);tile?.remove();callStatus(from+' left / declined the call')}
}
function endGroupCall(notify=false){stopRingtone();const gc=groupCall;groupCall=null;if(gc)clearTimeout(gc.timeout);if(gc){logCall({remote:'g:'+gc.gid,type:gc.type,connectedAt:gc.stream?gc.startedAt:null},gc.stream?'ended':'missed');gc.stream?.getTracks().forEach(t=>t.stop());for(const [n,pc] of gc.peers){pc.close();if(notify)signalSend(n,'group-hangup',{gid:gc.gid,cid:gc.cid}).catch(console.warn)}if(gc.inviter&&notify&&!gc.peers.has(gc.inviter))signalSend(gc.inviter,'group-hangup',{gid:gc.gid,cid:gc.cid}).catch(console.warn)}closeModal()}

function modal(html){$('#overlay').innerHTML=`<div class="overlay"><div class="card modal">${html}</div></div>`}function closeModal(){$('#overlay').innerHTML=''}
window.addEventListener('storage',e=>{if(e.key===KEY){db=getDb();if(!me||!db.users[me])return chooseAccount();const isOpen=!!selected&&(selected.startsWith('g:')?!!db.groups?.[selected.slice(2)]?.members.includes(me):friends(me,selected));if(selected&&!isOpen&&!selected.startsWith('g:')){selected='';render();return}const wasAtBottom=$('#messages')?$('#messages').scrollHeight-$('#messages').scrollTop-$('#messages').clientHeight<90:true;members();if(selected){const sig=chatSignature();if(sig!==lastChatSignature){chat();if(!wasAtBottom&&$('#messages'))$('#messages').scrollTop=0}}}if(e.key===SIGNAL_KEY)signalReceive()});
setInterval(()=>{if(me){const fresh=getDb();if(JSON.stringify(fresh)!==JSON.stringify(db)){db=fresh;members();if(selected){const sig=chatSignature();if(sig!==lastChatSignature)chat()}}signalReceive()}},1800);
// Experimental remote synchronization bridge. The original UI and local demo remain intact.
// WARNING: shared-state endpoint is deliberately for testing ONLY; public deployment requires
// authenticated user-scoped operations and server-side permission checks.
let globalVersion=0, globalSyncBusy=false, lastGlobalPush=Promise.resolve(), globalReady=false;
const initialSave=save;
save=function(){
 initialSave();
 if(!globalReady||!/^https:\/\/(?!REPLACE-)/i.test(serverUrl()))return;
 const snapshot=JSON.parse(JSON.stringify(db));
 const ver=globalVersion;
 lastGlobalPush=lastGlobalPush.then(async()=>{
  const r=await fetch(serverUrl()+'/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:ver,state:snapshot})});
  if(!r.ok)throw Error('Sync failed: '+r.status);
  const result=await r.json();globalVersion=result.version;
 }).catch(e=>console.warn('Sync push:',e));
};
async function globalPull(){
 if(!/^https:\/\/(?!REPLACE-)/i.test(serverUrl())||globalSyncBusy)return;
 globalSyncBusy=true;
 try{
  await lastGlobalPush;
  const r=await fetch(serverUrl()+'/state',{cache:'no-store'});if(!r.ok)throw Error('Server '+r.status);
  const result=await r.json();
  if(!globalReady||result.version!==globalVersion){
   globalVersion=result.version;
   localStorage.setItem(KEY,JSON.stringify(result.state));
   db=getDb();
   if(globalReady&&me&&!isChatLoading){members();if(selected){const sig=chatSignature();if(sig!==lastChatSignature)chat()}}
  }
  globalReady=true;
 }catch(e){console.warn('Global sync unavailable',e)}finally{globalSyncBusy=false}
}
setInterval(globalPull,2200);
db=getDb();me=null;sessionStorage.removeItem(SESSION);localStorage.removeItem(SESSION);chooseAccount();globalPull();remotePresenceTick();
